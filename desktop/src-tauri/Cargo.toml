[package]
name = "stash"
version = "1.3.0"
description = "stash for desktop — your library first, the open web second"
authors = ["BeesyOnGit"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "stash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "image-png", "macos-private-api"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# native-tls: YouTube's bot detection rejects the rustls TLS fingerprint with
# a 403 "automated queries" page; Windows' native TLS stack (SChannel) passes.
tauri-plugin-http = { version = "~2.7", default-features = false, features = ["unsafe-headers", "native-tls"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time", "rt", "net", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "native-tls"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
# Audio decoding (karaoke): MP3, AAC/M4A, FLAC, Ogg Vorbis, WAV, ALAC.
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "vorbis", "ogg", "wav", "pcm", "alac", "adpcm"] }
hound = "3.5"
rustfft = "6"
# The karaoke voice remover (UVR-MDX-NET) runs on ONNX Runtime.
ort = { version = "=2.0.0-rc.12", optional = true, default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-24"] }
# Wi-Fi sync with the phone app (src/sync.rs): HTTP + WebSocket server, mDNS,
# pairing (P-256 ECDH), HMAC-signed requests, AES-256-GCM, the pairing QR code.
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "ws", "query"] }
mdns-sd = "0.21.4"
if-addrs = "0.15.0"
hmac = "0.12"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
hostname = "0.4.2"
p256 = { version = "0.13", features = ["ecdh"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }

[features]
default = ["karaoke"]
# The voice remover. ONNX Runtime's prebuilt library needs the Visual Studio
# 2022 C++ tools on Windows; without them, build with it off (see desktop/README).
karaoke = ["dep:ort"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
panic = "unwind"

# The FFT and the model's pre/post processing are far too slow unoptimised.
[profile.dev.package.rustfft]
opt-level = 3
[profile.dev.package.symphonia-codec-aac]
opt-level = 3
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3
